name: Zizishou regression tests
on:
  push:
    branches:
      - experiment/general-audience
  pull_request:
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'package.json'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in dist/*.js; do node --check "$file"; done
      - name: Run Node tests
        run: npm test
